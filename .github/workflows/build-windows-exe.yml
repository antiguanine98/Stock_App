name: Build Windows EXE

on:
  push:
    branches: ["main", "cursor/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean main.spec

      - name: Rename artifact
        shell: pwsh
        run: |
          $exe = "dist/Stock_App_v1.38.exe"
          if (Test-Path $exe) {
            Write-Host "EXE ready: $exe"
          } elseif (Test-Path "dist/Stock_App_v1.38") {
            Move-Item "dist/Stock_App_v1.38" $exe
          } else {
            Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "Built EXE not found"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stock_App_v1.38
          path: dist/Stock_App_v1.38.exe

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Stock_App v1.38
          files: dist/Stock_App_v1.38.exe
          generate_release_notes: true
          body: |
            ## Summary
            - AI/챗봇 답변 생성 시 모달 잠금 제거 (인라인 로딩 + QThread 논블로킹)

            ## Assets
            - `Stock_App_v1.38.exe` (Windows one-file, Python 3.12)

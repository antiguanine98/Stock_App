name: Build Windows EXE

on:
  push:
    branches: ["main", "cursor/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean main.spec

      - name: Resolve EXE artifact
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "Stock_App_v*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "Built EXE not found (expected dist/Stock_App_v*.exe)"
          }
          Write-Host "EXE ready: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          if ($exe.Name -match 'Stock_App_(v[\d.]+)\.exe') {
            "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          } else {
            "version=unknown" >> $env:GITHUB_OUTPUT
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.name }}
          path: ${{ steps.exe.outputs.path }}

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Stock_App ${{ steps.exe.outputs.version }}
          files: ${{ steps.exe.outputs.path }}
          generate_release_notes: true
          body: |
            ## Summary
            - 공정서 매칭 영문명 우선, 매칭 실패/확인 필요와 미보유 분리
            - 확인시험·정량법 표준품 컬럼 기준 (A) 명시 / (B) 미사용 O/X 집계
            - 기원 예외 문구는 미보유 집계 제외·별도 목록
            - 동일 영문명 후속 로트 보유 시 구로트를 1년 소진·차년도 제조·급가속에서 제외
            - 표준 리포트 섹션 구성은 기존 유지

            ## Assets
            - `${{ steps.exe.outputs.name }}` (Windows one-file, Python 3.12 / PE VERSIONINFO 포함)

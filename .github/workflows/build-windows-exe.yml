name: Build Windows EXE

on:
  push:
    branches: ["main", "cursor/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean main.spec

      - name: Rename artifact
        shell: pwsh
        run: |
          $exe = "dist/Stock_App_v1.33.exe"
          if (Test-Path $exe) {
            Write-Host "EXE ready: $exe"
          } elseif (Test-Path "dist/Stock_App_v1.33") {
            Move-Item "dist/Stock_App_v1.33" $exe
          } else {
            Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "Built EXE not found"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stock_App_v1.33
          path: dist/Stock_App_v1.33.exe

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Stock_App v1.33
          files: dist/Stock_App_v1.33.exe
          generate_release_notes: true
          body: |
            ## Summary
            - 상단 엑셀/공정서/API Key 영역을 접이식 패널로 통합
            - 토글 및 파일 로드 완료 시 접어 하단 탭·챗봇 영역을 확대

            ## Assets
            - `Stock_App_v1.33.exe` (Windows one-file, Python 3.12)

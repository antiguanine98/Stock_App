name: Build Windows EXE

on:
  push:
    branches: ["main", "cursor/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean main.spec

      - name: Resolve EXE artifact
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "Stock_App_v*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "Built EXE not found (expected dist/Stock_App_v*.exe)"
          }
          Write-Host "EXE ready: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          if ($exe.Name -match 'Stock_App_(v[\d.]+)\.exe') {
            "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          } else {
            "version=unknown" >> $env:GITHUB_OUTPUT
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.name }}
          path: ${{ steps.exe.outputs.path }}

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Stock_App ${{ steps.exe.outputs.version }}
          files: ${{ steps.exe.outputs.path }}
          generate_release_notes: true
          body: |
            ## Summary
            - 공정서 미확보 판정 단순화: 수량>0 재고 이름/기원 매칭 시 무조건 확보
            - 부위 어간 정규화로 두충↔두충엽 등 포괄 매칭 (실재고 오분류 방지)
            - 신규/개발 대상 기원 단위 집계, KP·KHP 동등 1.0, 과다재고 커버리지 정렬
            - 확인시험 유/무 컬럼, 리포트 상세 표 전수 수록

            ## Assets
            - `${{ steps.exe.outputs.name }}` (Windows one-file, Python 3.12 / PE VERSIONINFO 포함)

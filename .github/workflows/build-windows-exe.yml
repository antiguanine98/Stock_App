name: Build Windows EXE

on:
  push:
    branches: ["main", "cursor/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean main.spec

      - name: Rename artifact
        shell: pwsh
        run: |
          $exe = "dist/Stock_App_v1.35.exe"
          if (Test-Path $exe) {
            Write-Host "EXE ready: $exe"
          } elseif (Test-Path "dist/Stock_App_v1.35") {
            Move-Item "dist/Stock_App_v1.35" $exe
          } else {
            Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "Built EXE not found"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stock_App_v1.35
          path: dist/Stock_App_v1.35.exe

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Stock_App v1.35
          files: dist/Stock_App_v1.35.exe
          generate_release_notes: true
          body: |
            ## Summary
            - 공정서 DB 구조화 매칭·미보유 선별, AI 좌우 분할, 3D 클릭→차트
            - KPI/리포트 정제, 소진∩급증 교집합, 제조검토 각 10종
            - v1.35: 챗봇 스냅샷 동기화, 리포트 Ctrl+F/접기, 대화 초기화

            ## Assets
            - `Stock_App_v1.35.exe` (Windows one-file, Python 3.12)

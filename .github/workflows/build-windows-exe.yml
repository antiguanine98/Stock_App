name: Build Windows EXE

on:
  push:
    branches: ["main", "cursor/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean main.spec

      - name: Rename artifact
        shell: pwsh
        run: |
          $exe = "dist/Stock_App_v1.31.exe"
          if (Test-Path $exe) {
            Write-Host "EXE ready: $exe"
          } elseif (Test-Path "dist/Stock_App_v1.31") {
            Move-Item "dist/Stock_App_v1.31" $exe
          } else {
            Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "Built EXE not found"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stock_App_v1.31
          path: dist/Stock_App_v1.31.exe

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Stock_App v1.31
          files: dist/Stock_App_v1.31.exe
          generate_release_notes: true
          body: |
            ## Summary
            - 신뢰도 A~D 등급(수집 횟수·관측 간격), 증가 구간 제외 분양속도
            - 분양 가속도(급가속/증가/안정/감소), 장기 저분양 선별
            - 현 재고×가격 분양금액 환산액(전체·유형별·TOP20)
            - 리포트 최상단 1페이지 KPI 대시보드 + 자동 종합 의견 (전문가 제언 제외)

            ## Assets
            - `Stock_App_v1.31.exe` (Windows one-file, Python 3.12)

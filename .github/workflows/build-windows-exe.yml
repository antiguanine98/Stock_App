name: Build Windows EXE

on:
  push:
    branches: ["main", "cursor/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean main.spec

      - name: Rename artifact
        shell: pwsh
        run: |
          $exe = "dist/Stock_App_v1.32.exe"
          if (Test-Path $exe) {
            Write-Host "EXE ready: $exe"
          } elseif (Test-Path "dist/Stock_App_v1.32") {
            Move-Item "dist/Stock_App_v1.32" $exe
          } else {
            Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "Built EXE not found"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stock_App_v1.32
          path: dist/Stock_App_v1.32.exe

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Stock_App v1.32
          files: dist/Stock_App_v1.32.exe
          generate_release_notes: true
          body: |
            ## Summary
            - 챗봇 후속 질문 시 재고 통합 DataFrame·지표를 실시간 재검토(Query) 후 답변
            - 공정서 DB를 후속 질문 컨텍스트에 반영
            - 시작 로딩창·작업 중 진행 다이얼로그 Windows 표시 수정

            ## Assets
            - `Stock_App_v1.32.exe` (Windows one-file, Python 3.12)

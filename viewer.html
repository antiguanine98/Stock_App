<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>재고 이력의 지형도 — 표준품 3차원 구조 분석</title>
<style>
  :root{
    --ink:#1a2b22; --ink-dim:#3d5348; --ink-faint:#6b7f74;
    --sage:#1f8a54; --indigo:#2f62c9; --clay:#c45a32;
    --axis-x:#b8860b; --axis-y:#c2185b; --axis-z:#0e7490;
    --panel-line: rgba(30,58,50,0.14);
    --panel-bg: #f7faf8;
    --card-bg: rgba(255,255,255,0.88);
    --sans: -apple-system, 'Malgun Gothic', 'Pretendard', sans-serif;
    --serif: Georgia, 'Noto Serif KR', serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background: var(--panel-bg);
    color: var(--ink); font-family: var(--sans); height:100%; overflow:hidden;
  }
  body{ display:flex; flex-direction:column; min-height:100vh; height:100vh; }
  .axis-key{
    display:flex; flex-wrap:wrap; gap:6px 14px; font-size:11px; color: var(--ink-dim);
    padding: 8px 14px; background:#ffffff; border-bottom:1px solid var(--panel-line); flex-shrink:0;
  }
  .axis-key span b{ color:var(--ink); font-weight:600; }

  main{ position:relative; flex:1; min-height:0; background: #eef3f0; display:flex; flex-direction:column; }
  #canvasWrap{ position:relative; width:100%; flex:1; min-height:75vh; height:100%; background:#eef3f0; touch-action:none; }
  canvas{ display:block; width:100%; height:100%; }
  #tooltip{
    position:absolute; pointer-events:none; display:none;
    background: rgba(255,255,255,0.96); border:1px solid rgba(30,58,50,0.22);
    color:var(--ink); font-size:12px; line-height:1.6; padding:9px 12px; border-radius:6px;
    max-width:240px; z-index:5; box-shadow:0 8px 22px rgba(20,40,30,0.12);
  }
  #tooltip b{ color: var(--axis-x); }
  #hint{
    position:absolute; bottom:12px; right:14px; left:auto; transform:none;
    font-size:11px; color:var(--ink-dim);
    background:rgba(255,255,255,0.92);
    border:1px solid rgba(30,58,50,0.16);
    padding:6px 12px; border-radius:16px; pointer-events:none;
    box-shadow:0 4px 14px rgba(20,40,30,0.08);
    max-width: min(360px, 78%);
    text-align:right;
    z-index:4;
  }
  #emptyMsg{
    display:none; position:absolute; inset:0; align-items:center; justify-content:center;
    text-align:center; color:var(--ink-dim); font-size:14px; padding:24px; line-height:1.7;
  }

  .legend-card{ margin: 8px 14px 10px; padding: 10px 14px; background: var(--card-bg); border: 1px solid var(--panel-line);
    border-radius: 8px; font-size: 12px; color: var(--ink-dim); line-height: 1.8; position:relative; flex-shrink:0; }
  .legend-card::before{ content:'표본 색인'; position:absolute; top:-9px; left:14px; background: #ffffff;
    padding: 0 8px; font-size:10px; letter-spacing:.14em; color:var(--sage); font-weight:600; }
  .legend-row{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .legend-row b{color:var(--ink); font-weight:600; min-width:56px; display:inline-block;}
  .swatch{display:inline-block; width:10px;height:10px;border-radius:2px; margin-right:5px; vertical-align:middle;}

  @media (max-width: 640px){
    .axis-key{padding:8px 12px; font-size:10.5px;} .legend-card{margin:8px 12px 10px;}
    #hint{ max-width: min(280px, 82%); font-size:10.5px; }
  }
</style>
</head>
<body>
<main>
  <div id="canvasWrap">
    <canvas id="c"></canvas>
    <div id="tooltip"></div>
    <div id="hint">클릭: 분양차트 이동 · 드래그: 회전 · 휠: 확대</div>
    <div id="emptyMsg">표시할 3D 산점도 데이터가 없습니다.<br>엑셀을 업로드하거나, 감소 추이가 있는 품목(AI 분석 대상)이 있는지 확인해 주세요.</div>
  </div>
</main>

<div class="legend-card">
  <div class="legend-row"><b>색상</b>
    <span><span class="swatch" style="background:#8FE0B0"></span>표준생약</span>
    <span><span class="swatch" style="background:#7AA8FF"></span>지표성분</span>
    <span><span class="swatch" style="background:#F0916A"></span>대조품</span>
  </div>
</div>

<script>
(function(){
"use strict";

const records = /*__RECORDS__*/[];
const SOURCE_FILE = /*__SOURCE_FILE__*/"";

const BASE_CAT_COLOR = {
  '표준생약': [143,224,176],
  '지표성분': [122,168,255],
  '대조품': [240,145,106],
  '대조생약': [240,145,106],
  '생약(표준생약)': [143,224,176],
  '생약(지표성분)': [122,168,255],
  '생약(대조품)': [240,145,106]
};
const EXTRA_PALETTE = [
  [186,150,255], [255,200,100], [120,220,220], [255,140,180],
  [160,210,90], [255,170,140], [140,180,255], [220,180,120]
];
const catColor = Object.assign({}, BASE_CAT_COLOR);
let extraIdx = 0;
function colorForCat(cat){
  if (!catColor[cat]){
    catColor[cat] = EXTRA_PALETTE[extraIdx % EXTRA_PALETTE.length];
    extraIdx += 1;
  }
  return catColor[cat];
}

function niceNum(range, round){
  if (!(range > 0) || !isFinite(range)) return 1;
  const exp = Math.floor(Math.log10(range));
  const frac = range / Math.pow(10, exp);
  let nice;
  if (round){
    if (frac < 1.5) nice = 1;
    else if (frac < 3) nice = 2;
    else if (frac < 7) nice = 5;
    else nice = 10;
  } else {
    if (frac <= 1) nice = 1;
    else if (frac <= 2) nice = 2;
    else if (frac <= 5) nice = 5;
    else nice = 10;
  }
  return nice * Math.pow(10, exp);
}

function niceLinearRange(minV, maxV, maxTicks){
  maxTicks = maxTicks || 5;
  if (!isFinite(minV) || !isFinite(maxV)) return { lo:0, hi:1, ticks:[0,1] };
  if (minV === maxV){
    const pad = Math.abs(minV) * 0.1 || 1;
    minV -= pad; maxV += pad;
  }
  const span = niceNum(maxV - minV, false);
  const step = niceNum(span / Math.max(maxTicks - 1, 1), true);
  let lo = Math.floor(minV / step) * step;
  let hi = Math.ceil(maxV / step) * step;
  if (lo === hi) hi = lo + step;
  const ticks = [];
  const n = Math.round((hi - lo) / step);
  for (let i = 0; i <= n; i++){
    const v = lo + step * i;
    const label = Math.abs(v) >= 100 || Number.isInteger(v)
      ? String(Math.round(v))
      : String(Number(v.toPrecision(4)));
    ticks.push({ value: v, label: label });
  }
  return { lo, hi, ticks };
}

function yYearsRange(yearsList){
  // AI 예상 소진기간: 0~50년 선형 (상한 캡 반영)
  let lo = 0;
  let hi = Math.max.apply(null, yearsList.concat([5]));
  if (!isFinite(hi) || hi <= 0) hi = 50;
  hi = Math.min(Math.max(hi, 5), 50);
  return niceLinearRange(lo, hi, 6);
}

function buildRange(recs){
  if (!recs.length){
    return {
      x: [0, 1], y: [0, 1], z: [0, 1],
      xTicks: [{value:0,label:'0'},{value:1,label:'1'}],
      yTicks: [{value:0,label:'0'},{value:1,label:'1'}],
      zTicks: [{value:0,label:'0'},{value:1,label:'1'}]
    };
  }
  const xs = recs.map(r => r.annualRate);
  const zs = recs.map(r => r.netDrop);
  const xR = niceLinearRange(Math.min.apply(null, xs), Math.max.apply(null, xs), 5);
  const zR = niceLinearRange(Math.min.apply(null, zs), Math.max.apply(null, zs), 5);
  const yR = yYearsRange(recs.map(r => r.yearsLeft != null ? r.yearsLeft : r.runway));
  return {
    x: [xR.lo, xR.hi],
    y: [yR.lo, yR.hi],
    z: [zR.lo, zR.hi],
    xTicks: xR.ticks,
    yTicks: yR.ticks,
    zTicks: zR.ticks
  };
}

const RANGE_FULL = buildRange(records);
const RANGE = { x: RANGE_FULL.x, y: RANGE_FULL.y, z: RANGE_FULL.z };

function norm(v, lo, hi){
  if (hi === lo) return 0;
  return ((v - lo) / (hi - lo)) * 2 - 1;
}

const pts = records.map(r => ({
  x: norm(r.annualRate, RANGE.x[0], RANGE.x[1]),
  y: norm((r.yearsLeft != null ? r.yearsLeft : r.runway), RANGE.y[0], RANGE.y[1]),
  z: norm(r.netDrop, RANGE.z[0], RANGE.z[1]),
  r: r
}));

const canvas = document.getElementById('c');
const wrap = document.getElementById('canvasWrap');
const tooltip = document.getElementById('tooltip');
const emptyMsg = document.getElementById('emptyMsg');
const ctx = canvas.getContext('2d');

if (!records.length){
  emptyMsg.style.display = 'flex';
  document.getElementById('hint').style.display = 'none';
}

let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize(){
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

let theta = 0.72, phi = -0.5;   // rotation angles
let zoom = 1;
let dragging = false, lastX = 0, lastY = 0;
let idleSpin = true;
let lastInteraction = Date.now();
const IDLE_RESUME_MS = 60000;

function rotate(p){
  const ct = Math.cos(theta), st = Math.sin(theta);
  const cp = Math.cos(phi), sp = Math.sin(phi);
  const x1 = p.x*ct + p.z*st;
  const z1 = -p.x*st + p.z*ct;
  const y2 = p.y*cp - z1*sp;
  const z2 = p.y*sp + z1*cp;
  return { x: x1, y: y2, z: z2 };
}

function project(p){
  const scale = Math.min(W, H) * 0.34 * zoom;
  const persp = 1 + p.z * 0.18;
  return {
    sx: W/2 + p.x * scale * persp,
    sy: H/2 - p.y * scale * persp,
    depth: p.z
  };
}

const POINT_SIZE = 2.6;

const AXES = [
  { from:{x:-1.15,y:-1,z:-1}, to:{x:1.15,y:-1,z:-1}, label:'연평균 분양량', axis:'x', color:'#b8860b',
    ticks: RANGE_FULL.xTicks },
  { from:{x:-1.15,y:-1,z:-1}, to:{x:-1.15,y:1.05,z:-1}, label:'예상 소진기간(년)', axis:'y', color:'#c2185b',
    ticks: RANGE_FULL.yTicks },
  { from:{x:-1.15,y:-1,z:-1}, to:{x:-1.15,y:-1,z:1.1}, label:'순감소량', axis:'z', color:'#0e7490',
    ticks: RANGE_FULL.zTicks }
];

function lerp(a,b,t){ return a + (b-a)*t; }

function draw(){
  ctx.clearRect(0,0,W,H);
  if (!records.length) return;

  // depth-sort points (painter's algorithm)
  const projected = pts.map(p => {
    const rp = rotate(p);
    const pr = project(rp);
    return { ...pr, r: p.r };
  });
  projected.sort((a,b) => a.depth - b.depth);

  // axis lines
  ctx.lineWidth = 1;
  AXES.forEach(ax => {
    const a = project(rotate(ax.from));
    const b = project(rotate(ax.to));
    ctx.strokeStyle = 'rgba(45,70,58,0.35)';
    ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();

    ax.ticks.forEach(tk => {
      const lo = RANGE[ax.axis][0], hi = RANGE[ax.axis][1];
      const t = (tk.value - lo) / (hi - lo || 1);
      const p3 = {
        x: lerp(ax.from.x, ax.to.x, t),
        y: lerp(ax.from.y, ax.to.y, t),
        z: lerp(ax.from.z, ax.to.z, t)
      };
      const sp = project(rotate(p3));
      ctx.fillStyle = 'rgba(26,43,34,0.88)';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(tk.label, sp.sx, sp.sy + 12);
    });

    const lp = project(rotate(ax.to));
    ctx.fillStyle = ax.color;
    ctx.font = '600 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ax.label, lp.sx, lp.sy - 10);
  });

  // points
  projected.forEach(p => {
    const c = colorForCat(p.r.cat);
    const alpha = 0.55 + (p.depth + 1) / 2 * 0.4;
    const size = POINT_SIZE * (1 + p.depth * 0.15);
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, size, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
    ctx.fill();
  });

  window._projected = projected;
}

function loop(){
  if (!idleSpin && !dragging && Date.now() - lastInteraction > IDLE_RESUME_MS) idleSpin = true;
  if (idleSpin && !dragging && records.length) theta += 0.0022;
  draw();
  requestAnimationFrame(loop);
}

// interaction: mouse = hover follows cursor; touch = drag rotates, tap shows info, pinch zooms
const activePointers = new Map();
let startX = 0, startY = 0, moved = false;
let pinchStartDist = 0, pinchStartZoom = 1;

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function pointerDistance(){
  const vals = [...activePointers.values()];
  return Math.hypot(vals[0].x - vals[1].x, vals[0].y - vals[1].y);
}
function fmtNum(v){
  if (typeof v !== 'number' || !isFinite(v)) return String(v);
  if (Math.abs(v) >= 100) return String(Math.round(v * 100) / 100);
  return String(Number(v.toPrecision(4)));
}
function findRecordAt(p){
  const list = window._projected || [];
  let best = null, bestD = 22;
  for (const pt of list){
    const d = Math.hypot(pt.sx - p.x, pt.sy - p.y);
    if (d < bestD){ bestD = d; best = pt; }
  }
  return best ? best.r : null;
}
function pickPoint(r){
  if(!r) return;
  const code = r.code || '';
  const name = r.name || '';
  location.hash = 'pick:' + encodeURIComponent(code) + '|' + encodeURIComponent(name);
}
function showInfoAt(p){
  const r = findRecordAt(p);
  if (r){
    const tags = [];
    if (r.depleteWithin5y) tags.push('5년 소진 위험');
    if (r.recentSurge) tags.push('최근 분양 급증');
    if (r.aiMentioned) tags.push('AI 리포트 언급');
    const tagHtml = tags.length ? `<br><span style="color:#b91c1c">${tags.join(' · ')}</span>` : '';
    const yearsLeft = (typeof r.yearsLeft === 'number' && isFinite(r.yearsLeft))
      ? (r.yearsCapped ? fmtNum(r.yearsLeft) + '년+' : fmtNum(r.yearsLeft) + '년')
      : '-';
    const rawYears = (typeof r.yearsLeftRaw === 'number' && isFinite(r.yearsLeftRaw) && r.yearsCapped)
      ? ` (산출 ${fmtNum(r.yearsLeftRaw)}년)` : '';
    tooltip.innerHTML = `<b>${r.name}</b> (${r.code})<br>` +
      `연평균 분양량 ${fmtNum(r.annualRate)} · 예상 소진 ${yearsLeft}${rawYears}<br>` +
      `순감소량 ${fmtNum(r.netDrop)} · 현재재고 ${fmtNum(r.balance)} · 관찰기간 ${fmtNum(r.elapsedYears)}년<br>` +
      `분양속도 ${r.speed || '-'}` + tagHtml;
    let left = p.x + 14, top = p.y + 10;
    if (left + 240 > W) left = p.x - 254;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    tooltip.style.display = 'block';
  } else {
    tooltip.style.display = 'none';
  }
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  const p = getPos(e);
  activePointers.set(e.pointerId, p);
  idleSpin = false;
  lastInteraction = Date.now();
  if (activePointers.size === 2){
    dragging = false;
    pinchStartDist = pointerDistance();
    pinchStartZoom = zoom;
    tooltip.style.display = 'none';
  } else if (activePointers.size === 1){
    dragging = true; moved = false;
    startX = lastX = p.x; startY = lastY = p.y;
  }
});

window.addEventListener('pointermove', (e) => {
  const p = getPos(e);
  if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, p);

  if (activePointers.size === 2){
    const dist = pointerDistance();
    if (pinchStartDist > 0){
      zoom = Math.max(0.4, Math.min(3.2, pinchStartZoom * (dist / pinchStartDist)));
    }
    lastInteraction = Date.now();
    return;
  }

  if (dragging && activePointers.size === 1){
    const dx = p.x - lastX, dy = p.y - lastY;
    theta += dx * 0.006;
    phi = Math.max(-1.4, Math.min(1.4, phi + dy * 0.006));
    lastX = p.x; lastY = p.y;
    lastInteraction = Date.now();
    if (Math.hypot(p.x - startX, p.y - startY) > 6) moved = true;
    if (e.pointerType !== 'mouse') tooltip.style.display = 'none';
    return;
  }

  if (e.pointerType === 'mouse' && activePointers.size === 0){
    showInfoAt(p);
    canvas.style.cursor = tooltip.style.display === 'block' ? 'pointer' : 'grab';
  }
});

function endPointer(e){
  const p = getPos(e);
  const wasSingle = activePointers.size === 1;
  activePointers.delete(e.pointerId);

  if (wasSingle && !moved){
    showInfoAt(p);
    pickPoint(findRecordAt(p));
  }
  if (activePointers.size === 0){
    dragging = false;
  } else if (activePointers.size === 1){
    const remaining = [...activePointers.values()][0];
    lastX = remaining.x; lastY = remaining.y;
    dragging = true; moved = true;
  }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoom = Math.max(0.4, Math.min(3.2, zoom * ((e.deltaY < 0) ? 1.08 : 0.92)));
  idleSpin = false;
  lastInteraction = Date.now();
}, { passive:false });

resize();
loop();
})();
</script>
</body>
</html>
